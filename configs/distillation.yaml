# Stage 4: consistency distillation of the Stage 2 flow-matching teacher
# (pipeline/train_distill.py). The student has the teacher's architecture and
# starts from its weights; data come from the same latent manifest.

distill:
  num_scales: 50              # N: discretisation of the teacher trajectory (its Euler step count)
  teacher_cfg_scale: 1.0      # guidance baked into the teacher step
  huber_c: null               # Pseudo-Huber constant; null = 0.00054 * sqrt(C * T)
  target_ema_decay: 0.999     # EMA student that provides the consistency target
  init_from_teacher: true
  use_teacher_ema: true       # distil the teacher's EMA weights

data:
  segment_seconds: 10.0
  full_set_prob: 0.5
  bleed_cond_prob: 0.5
  min_active_fraction: 0.25
  min_class_active_fraction: 0.05
  slakh_fraction: 0.333
  num_workers: 6

training:
  batch_size: 32
  grad_accum: 1
  max_steps: 50000            # a budget
  lr: 2.0e-5
  warmup_steps: 1000
  weight_decay: 0.0
  grad_clip: 1.0
  precision: auto
  seed: 0
  log_every: 50
  valid_every: 2000
  save_every: 5000
  valid_batches: 20

sampling:
  num_steps: 2                # consistency steps at inference (1-4)
